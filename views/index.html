<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouShop Creator Hub</title>
    <link rel="icon" href="https://app.youshop.com.br/images/logos/s-colorful.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>

        body{
            padding-top: 120px; 
        }
        
        .bg-youshop-green {
            background-color: rgb(159, 239, 20);
        }
    </style>
    <script src="{{ url_for('static',filename='scripts/script.js') }}" defer></script>
</head>

<body>
    <nav class="navbar shadow p-3 mb-5 bg-body-tertiary rounded fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="https://app.youshop.com.br/images/logos/s-colorful.png" alt="Bootstrap" width="60"
                    height="48">
            </a>

            <div class="d-flex justify-end">
                <ion-icon name="moon-outline" id="themeIcon" size="large" style="cursor: pointer;"></ion-icon>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <h1 class="text-center">Vitrine de Produtos</h1>
        <div id="produto-container"></div>

        <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modal" aria-hidden="true">
            <div class="modal-dialog modal-dialog-scrollable">
                <div class="modal-content">

                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="produto-nome"></h1>
                    </div>
                    <div class="modal-body">
                        <img src="" class="img-fluid mx-auto d-block" alt="imagem do produto" id="produto-img">

                        <div class="text-center my-2">
                            <b id="produto-comissao"></b>
                        </div>
                        <p id="produto-desc"></p>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">
                            <ion-icon name="arrow-back-outline"></ion-icon> Voltar
                        </button>
                        <button type="button" class="btn btn-success">Gerar Roteiro com IA</button>
                        
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>

</body>

</html>
